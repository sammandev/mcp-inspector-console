worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 15s;
    client_max_body_size 2m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream application {
        include /etc/nginx/upstreams/active.conf;
        keepalive 16;
    }

    server {
        # TLS is required: LAN browsers only get a secure context (Web Crypto,
        # Fetch Metadata) over HTTPS, and the Inspector relies on both.
        listen 7000 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Plain HTTP sent to this port is redirected to HTTPS.
        error_page 497 =301 https://$host:$server_port$request_uri;

        location = /edge-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /assets/ {
            alias /srv/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # The stdio relay spawns server processes; it is local-only.
        location ^~ /mcp/inspector/api/local {
            return 403;
        }

        location / {
            proxy_pass http://application;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            # MCP SSE streams and streamed chat completions stay open.
            proxy_buffering off;
            proxy_read_timeout 1h;
            add_header X-Release-Upstream $upstream_addr always;
        }
    }
}
